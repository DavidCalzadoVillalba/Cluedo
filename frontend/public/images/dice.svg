<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="dieGrad1" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>
    <radialGradient id="dieGrad2" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Left Die (showing 5) -->
  <g transform="translate(6, 14) rotate(-10 18 18)" filter="url(#shadow)">
    <rect x="0" y="0" width="32" height="32" rx="6" ry="6" fill="url(#dieGrad1)" stroke="#94a3b8" stroke-width="1.2"/>
    <!-- 5 pips -->
    <circle cx="8" cy="8" r="2.4" fill="#0f172a"/>
    <circle cx="24" cy="8" r="2.4" fill="#0f172a"/>
    <circle cx="16" cy="16" r="2.6" fill="#b91c1c"/>
    <circle cx="8" cy="24" r="2.4" fill="#0f172a"/>
    <circle cx="24" cy="24" r="2.4" fill="#0f172a"/>
  </g>

  <!-- Right Die (showing 3) -->
  <g transform="translate(26, 18) rotate(14 18 18)" filter="url(#shadow)">
    <rect x="0" y="0" width="32" height="32" rx="6" ry="6" fill="url(#dieGrad2)" stroke="#ca8a04" stroke-width="1.2"/>
    <!-- 3 pips -->
    <circle cx="8" cy="8" r="2.4" fill="#0f172a"/>
    <circle cx="16" cy="16" r="2.6" fill="#0f172a"/>
    <circle cx="24" cy="24" r="2.4" fill="#0f172a"/>
  </g>
</svg>

